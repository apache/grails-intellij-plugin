version: 2
updates:
  # Main build (root Gradle project + all modules)
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    target-branch: main
    labels:
      - "type: dependency upgrade"
  # build-logic included build (convention plugins + their tool dependencies)
  - package-ecosystem: gradle
    directory: "/build-logic"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    target-branch: main
    labels:
      - "type: dependency upgrade"
  # GitHub Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: main
    labels:
      - "type: dependency upgrade"
