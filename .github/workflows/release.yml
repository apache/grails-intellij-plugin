# ASF policy framing: the official release is the signed source archive, voted on by
# the PMC and published to dist.apache.org; the plugin ZIP on JetBrains Marketplace
# is a convenience binary.
name: "Release"
on:
  release:
    types: [ published ]
permissions: { }
env:
  DIST_NAME: apache-grails-intellij-plugin
  JAVA_DISTRIBUTION: liberica # .sdkmanrc pins librca = Liberica
  PROJECT_NAME: Apache Grails IntelliJ Plugin
  PROJECT_DESC: >-
    The Apache Grails IntelliJ Plugin adds Apache Grails support to IntelliJ IDEA Ultimate:
    GSP language support, Grails project structure and navigation, run configurations,
    taglib and domain class support, and integrations for i18n, coverage, Hibernate, Maven,
    and language injection.
  REPO_SLUG: ${{ github.repository }}
  SVN_FOLDER: INTELLIJ
  SVN_PROJECT: grails
  TAG: ${{ github.event.release.tag_name }}
  VERSION: will be computed in each job
concurrency:
  group: release-pipeline-${{ github.event.release.target_commitish }}
  cancel-in-progress: false
jobs:
  publish:
    name: "Build & Stage Plugin ZIP"
    permissions:
      contents: write # to upload release assets
    runs-on: ubuntu-latest
    steps:
      - name: "📝 Establish release version"
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: "📝 Read JDK version from .sdkmanrc"
        id: sdkmanrc
        run: echo "java=$(grep -E '^java=' .sdkmanrc | cut -d= -f2 | sed 's/-librca$//')" >> "$GITHUB_OUTPUT"
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ steps.sdkmanrc.outputs.java }}
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-provider: basic # 'basic' uses the MIT-licensed, open-source cache provider; the default 'enhanced' provider (v6+) is proprietary (Gradle commercial Terms of Use)
      - name: "🏗️ Build & Test"
        run: ./gradlew check buildPlugin -Pversion=${VERSION}
      - name: "🔏 Sign plugin ZIP for JetBrains Marketplace"
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin -Pversion=${VERSION}
      - name: "📦 Rename plugin ZIP to distribution name"
        # The ZIP base name comes from intellijPlatform.projectName, pinned to
        # 'apache-grails-intellij-plugin' by the intellij-plugin convention plugin, so this
        # rename is now effectively a copy. Glob rather than hardcode anyway, so a future
        # rename cannot silently break the release; fail loudly unless exactly one file matches.
        run: |
          set -euo pipefail
          shopt -s nullglob
          signed=(plugin/build/distributions/*-"${VERSION}"-signed.zip)
          if [[ ${#signed[@]} -ne 1 ]]; then
            echo "::error::expected exactly 1 signed plugin ZIP for ${VERSION} in plugin/build/distributions, found ${#signed[@]}: ${signed[*]-}"
            exit 1
          fi
          cp "${signed[0]}" "${DIST_NAME}-${VERSION}-bin.zip"
      - name: "🔐 Set up GPG" # use env var to not expose the key
        env:
          GPG_KEY: ${{ secrets.GRAILS_GPG_KEY }}
        run: |
          echo "${GPG_KEY}" | gpg --batch --import
          gpg --list-keys
      - name: "🔏 GPG-sign plugin ZIP"
        run: >
          gpg
          --default-key "${{ secrets.GPG_KEY_ID }}"
          --batch
          --yes
          --pinentry-mode loopback
          --armor
          --detach-sign
          ${DIST_NAME}-${VERSION}-bin.zip
      - name: "📦 Create plugin ZIP checksum"
        run: sha512sum ${DIST_NAME}-${VERSION}-bin.zip > ${DIST_NAME}-${VERSION}-bin.zip.sha512
      - name: "🚀 Upload plugin ZIP to GitHub Release"
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ env.TAG }}
          files: |
            ${{ env.DIST_NAME }}-${{ env.VERSION }}-bin.zip
            ${{ env.DIST_NAME }}-${{ env.VERSION }}-bin.zip.sha512
            ${{ env.DIST_NAME }}-${{ env.VERSION }}-bin.zip.asc
  source:
    name: "Create Source Distribution"
    needs: publish
    permissions:
      contents: write # to upload release assets
    runs-on: ubuntu-latest
    steps:
      - name: "📝 Establish release version"
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: grails-intellij-plugin
          ref: ${{ env.TAG }}
      - name: "🗑️ Remove files that must not ship in the source distribution"
        run: |
          rm -rf grails-intellij-plugin/.git
          rm -rf grails-intellij-plugin/.github
          rm -f grails-intellij-plugin/.asf.yaml
          rm -f grails-intellij-plugin/gradlew grails-intellij-plugin/gradlew.bat
          rm -rf grails-intellij-plugin/gradle/wrapper
      - name: "📦 Create source distribution ZIP"
        run: zip -r ${DIST_NAME}-${VERSION}-src.zip grails-intellij-plugin
      - name: "🔐 Set up GPG" # use env var to not expose the key
        env:
          GPG_KEY: ${{ secrets.GRAILS_GPG_KEY }}
        run: |
          echo "${GPG_KEY}" | gpg --batch --import
          gpg --list-keys
      - name: "🔏 Sign source distribution ZIP"
        run: >
          gpg
          --default-key "${{ secrets.GPG_KEY_ID }}"
          --batch
          --yes
          --pinentry-mode loopback
          --armor
          --detach-sign
          ${DIST_NAME}-${VERSION}-src.zip
      - name: "📦 Create source distribution checksum"
        run: sha512sum ${DIST_NAME}-${VERSION}-src.zip > ${DIST_NAME}-${VERSION}-src.zip.sha512
      - name: "🚀 Upload ZIP and Signature to GitHub Release"
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ env.TAG }}
          files: |
            ${{ env.DIST_NAME }}-${{ env.VERSION }}-src.zip
            ${{ env.DIST_NAME }}-${{ env.VERSION }}-src.zip.sha512
            ${{ env.DIST_NAME }}-${{ env.VERSION }}-src.zip.asc
  upload:
    name: "Upload Distributions to dist.apache.org"
    needs: [ publish, source ]
    permissions:
      contents: read # to check out the vote templates and resolve the tag SHA
    runs-on: ubuntu-latest
    env:
      SVN_USERNAME: ${{ secrets.SVC_DIST_GRAILS_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVC_DIST_GRAILS_PASSWORD }}
    steps:
      - name: "📝 Establish release version"
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: "🛠️ Install tools"
        run: sudo apt-get install -y subversion tree gettext-base # gettext-base provides envsubst for the vote email
      - name: "👀 Ensure dev/${{ env.SVN_PROJECT }}/${{ env.SVN_FOLDER }} folder exists"
        run: |
          set -e
          if svn ls https://dist.apache.org/repos/dist/dev/${SVN_PROJECT}/${SVN_FOLDER} --username "${SVN_USERNAME}" --password "${SVN_PASSWORD}" --non-interactive; then
            echo "Dev Folder [${SVN_PROJECT}/${SVN_FOLDER}] already exists — skipping creation"
          else
            echo "Dev Folder [${SVN_PROJECT}/${SVN_FOLDER}] does not exist, creating"
            svnmucc --username "${SVN_USERNAME}" --password "${SVN_PASSWORD}" --non-interactive \
              mkdir https://dist.apache.org/repos/dist/dev/${SVN_PROJECT}/${SVN_FOLDER} \
              -m "Create '${SVN_PROJECT}/${SVN_FOLDER}' dev folder"
          fi
      - name: "📥 Checkout dev repo"
        run: |
          svn checkout --username "${SVN_USERNAME}" --password "${SVN_PASSWORD}" --non-interactive "https://dist.apache.org/repos/dist/dev/${SVN_PROJECT}/${SVN_FOLDER}" dev-repo
      - name: "🗑️ Remove existing dev version"
        run: |
          cd dev-repo
          if [ -d "${VERSION}" ]; then
            svn delete "${VERSION}"
            svn commit -m "Remove ${SVN_PROJECT} ${SVN_FOLDER} dev version ${VERSION}" --username "${SVN_USERNAME}" --password "${SVN_PASSWORD}" --non-interactive
          else
            echo "No existing dev version ${VERSION} to remove"
          fi
      - name: "📥 Fetch source distribution"
        run: |
          cd dev-repo
          mkdir -p ${VERSION}/sources
          cd ${VERSION}/sources
          curl -f -LO https://github.com/${REPO_SLUG}/releases/download/${TAG}/${DIST_NAME}-${VERSION}-src.zip
          curl -f -LO https://github.com/${REPO_SLUG}/releases/download/${TAG}/${DIST_NAME}-${VERSION}-src.zip.sha512
          curl -f -LO https://github.com/${REPO_SLUG}/releases/download/${TAG}/${DIST_NAME}-${VERSION}-src.zip.asc
          ls -l
      - name: "📥 Fetch binary distribution"
        run: |
          cd dev-repo
          mkdir -p ${VERSION}/distribution
          cd ${VERSION}/distribution
          curl -f -LO https://github.com/${REPO_SLUG}/releases/download/${TAG}/${DIST_NAME}-${VERSION}-bin.zip
          curl -f -LO https://github.com/${REPO_SLUG}/releases/download/${TAG}/${DIST_NAME}-${VERSION}-bin.zip.sha512
          curl -f -LO https://github.com/${REPO_SLUG}/releases/download/${TAG}/${DIST_NAME}-${VERSION}-bin.zip.asc
          ls -l
      - name: "🚀 Upload distributions"
        run: |
          cd dev-repo
          echo "Adding the following files to SVN:"
          tree
          svn add ${VERSION} --force
          svn commit -m "Upload ${PROJECT_NAME} distribution files for ${VERSION}" --username "${SVN_USERNAME}" --password "${SVN_PASSWORD}" --non-interactive
      - name: "💾 Store Distribution SVN revision in a file"
        # The vote email cites the SVN revision so voters can confirm they are looking at
        # the same artifacts that were staged, even if the folder is touched afterwards.
        run: |
          cd dev-repo
          svn info ${VERSION} > DIST_SVN_REVISION.txt
          cat DIST_SVN_REVISION.txt
      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          ref: ${{ env.TAG }}
      - name: "📝 Resolve the tag commit id"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # An annotated tag points at a tag object, so dereference it to the commit.
        run: |
          set -euo pipefail
          ref_json=$(gh api "repos/${REPO_SLUG}/git/ref/tags/${TAG}")
          type=$(jq -r '.object.type' <<< "$ref_json")
          sha=$(jq -r '.object.sha' <<< "$ref_json")
          if [ "$type" = "tag" ]; then
            sha=$(gh api "repos/${REPO_SLUG}/git/tags/${sha}" --jq '.object.sha')
          fi
          echo "Found sha: $sha"
          echo "SHA=${sha}" >> "$GITHUB_ENV"
      - name: "📧 Print Grails PMC Vote Email"
        run: |
          export DIST_SVN_REVISION=$(awk '/Last Changed Rev:/ {print $4}' dev-repo/DIST_SVN_REVISION.txt)

          echo "::group::Grails PMC Vote Email"
          echo ""
          echo "TO:"
          echo "*************************************************"
          echo "dev@grails.apache.org"
          echo "*************************************************"
          echo ""
          echo "Subject:"
          echo "*************************************************"
          echo "[VOTE] Release ${PROJECT_NAME} ${VERSION}"
          echo "*************************************************"
          echo ""
          echo "Body:"
          echo "*************************************************"
          cat repo/.github/vote_templates/staged.txt | envsubst
          echo "*************************************************"
          echo "::endgroup::"
  release:
    environment: release # post-vote gate: required reviewers configured in .asf.yaml
    name: "VOTE SUCCEEDED - Publish Release"
    needs: [ publish, source, upload ]
    runs-on: ubuntu-latest
    steps:
      - name: "📝 Establish release version"
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: "🗳 MANUAL - Confirm Grails PMC Vote succeeded"
        run: |
          echo "::group::Manual Confirmation"
          echo "🔎 Make sure that the vote confirmation on dev@grails.apache.org completed successfully before proceeding."
          echo "::endgroup::"
      - name: "🚀 MANUAL - Release distribution artifacts"
        run: |
          echo "::group::Manual ASF Artifact Promotion"
          echo "Run .github/scripts/releaseDistributions.sh ${TAG} ${SVN_FOLDER} <ASF_USER>"
          echo "::endgroup::"
      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: "📝 Read JDK version from .sdkmanrc"
        id: sdkmanrc
        run: echo "java=$(grep -E '^java=' .sdkmanrc | cut -d= -f2 | sed 's/-librca$//')" >> "$GITHUB_OUTPUT"
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ steps.sdkmanrc.outputs.java }}
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-provider: basic # see note above
      - name: "🚀 Publish to JetBrains Marketplace"
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin -Pversion=${VERSION}
      - name: "✅ MANUAL - Update ASF Reporter"
        run: |
          echo "::group::Manual ASF Reporter Update"
          TODAY=$(date +"%Y-%m-%d")
          echo "Update https://reporter.apache.org/addrelease.html?${SVN_PROJECT} to add"
          echo "${SVN_FOLDER}-${VERSION} as complete as of ${TODAY}"
          echo "::endgroup::"
      - name: "📧 MANUAL - Send Vote Result Email"
        run: |
          echo "::group::Manual Vote Result Email"
          echo ""
          echo "Send a new email or reply to the original vote email by changing the subject."
          echo ""
          echo "TO:"
          echo "*************************************************"
          echo "dev@grails.apache.org"
          echo "*************************************************"
          echo ""
          echo "Subject:"
          echo "*************************************************"
          echo "[RESULT][VOTE] ${PROJECT_NAME} ${VERSION}"
          echo "*************************************************"
          echo ""
          echo "Body:"
          echo "*************************************************"
          cat .github/vote_templates/vote_succeeded.txt | envsubst
          echo "*************************************************"
          echo "::endgroup::"
      - name: "📧 MANUAL - Send Announcement Email"
        run: |
          echo "::group::Announcement Email"
          echo ""
          echo "Announcements must be sent from your @apache.org address."
          echo "See https://infra.apache.org/committer-email.html"
          echo ""
          echo "TO:"
          echo "*************************************************"
          echo "announce@apache.org, dev@grails.apache.org, users@grails.apache.org"
          echo "*************************************************"
          echo ""
          echo "Subject:"
          echo "*************************************************"
          echo "[ANNOUNCE] ${PROJECT_NAME} ${VERSION}"
          echo "*************************************************"
          echo ""
          echo "Body:"
          echo "*************************************************"
          cat .github/vote_templates/announce.txt | envsubst
          echo "*************************************************"
          echo "::endgroup::"
