name: "CI"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
# Queue jobs - cancel in-progress PR runs when new commits are pushed, but allow branch builds to complete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: 'Build & Test'
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "📝 Read JDK version from .sdkmanrc"
        id: sdkmanrc
        run: echo "java=$(grep -E '^java=' .sdkmanrc | cut -d= -f2 | sed 's/-librca$//')" >> "$GITHUB_OUTPUT"
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: liberica # .sdkmanrc pins librca = Liberica
          java-version: ${{ steps.sdkmanrc.outputs.java }}
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-provider: basic # 'basic' uses the MIT-licensed, open-source cache provider; the default 'enhanced' provider (v6+) is proprietary (Gradle commercial Terms of Use)
      - name: "🏗️ Build & Test"
        run: ./gradlew check buildPlugin
      - name: "📦 Upload plugin ZIP"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-zip
          path: build/distributions/*.zip
  verify:
    name: 'Plugin Verifier'
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "📝 Read JDK version from .sdkmanrc"
        id: sdkmanrc
        run: echo "java=$(grep -E '^java=' .sdkmanrc | cut -d= -f2 | sed 's/-librca$//')" >> "$GITHUB_OUTPUT"
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: liberica # .sdkmanrc pins librca = Liberica
          java-version: ${{ steps.sdkmanrc.outputs.java }}
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-provider: basic # see note above
      - name: "🔎 IntelliJ Plugin Verifier"
        run: ./gradlew verifyPlugin
      - name: "📋 Upload verifier report"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier
