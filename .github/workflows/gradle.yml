name: "CI"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Nightly Community Edition checks: the job also runs on every pull request and push, but an
  # upstream Community binary change can break the IdeaIC sandbox with no change on our side.
  schedule:
    - cron: '0 3 * * *'
# Queue jobs - cancel in-progress PR runs when new commits are pushed, but allow branch builds to complete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: 'Build & Test'
    # The scheduled run is reserved for the Community Edition job below.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "🔒 Check .sdkmanrc pins the wrapper's Gradle version"
        # The source distribution ships without the wrapper and regenerates it at the Gradle
        # version in .sdkmanrc, so a stale pin makes release verification rebuild with a different
        # Gradle than CI released with. Dependabot bumps the wrapper but cannot update .sdkmanrc.
        run: |
          sdkman="$(sed -n 's/^gradle=//p' .sdkmanrc)"
          wrapper="$(sed -nE 's/^distributionUrl=.*gradle-(.+)-(bin|all)\.zip$/\1/p' gradle/wrapper/gradle-wrapper.properties)"
          if [ -z "$sdkman" ] || [ "$sdkman" != "$wrapper" ]; then
            echo "::error file=.sdkmanrc::.sdkmanrc pins gradle=${sdkman} but the wrapper uses Gradle ${wrapper}. Set gradle=${wrapper} in .sdkmanrc and update the Gradle version in INSTALL, README.md and AGENTS.md."
            exit 1
          fi
          echo "✅ .sdkmanrc and the wrapper both use Gradle ${sdkman}"
      - name: "📝 Read JDK version from .sdkmanrc"
        id: sdkmanrc
        run: echo "java=$(grep -E '^java=' .sdkmanrc | cut -d= -f2 | sed 's/-librca$//')" >> "$GITHUB_OUTPUT"
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: liberica # .sdkmanrc pins librca = Liberica
          java-version: ${{ steps.sdkmanrc.outputs.java }}
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic # 'basic' uses the MIT-licensed, open-source cache provider; the default 'enhanced' provider (v6+) is proprietary (Gradle commercial Terms of Use)
      - name: "🏗️ Build & Test"
        run: ./gradlew check buildPlugin
      - name: "📝 Determine plugin ZIP name"
        id: plugin-zip
        run: echo "name=$(basename plugin/build/distributions/*.zip .zip)" >> "$GITHUB_OUTPUT"
      - name: "📦 Upload plugin ZIP"
        id: upload-plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.plugin-zip.outputs.name }}
          path: plugin/build/distributions/*.zip
          archive: false # serve the plugin zip as-is instead of wrapping it in another zip (requires upload-artifact v7+)
      - name: "📢 Publish plugin to job summary"
        env:
          ARTIFACT_URL: ${{ steps.upload-plugin.outputs.artifact-url }}
        run: |
          {
            echo "## 📦 Snapshot Plugin Build"
            echo ""
            echo "| File | Size | Download |"
            echo "|------|------|----------|"
            for zip in plugin/build/distributions/*.zip; do
              echo "| \`$(basename "$zip")\` | $(du -h "$zip" | cut -f1) | [snapshot ${{ steps.plugin-zip.outputs.name }} artifact]($ARTIFACT_URL) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
  verify:
    name: 'Plugin Verifier'
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "📝 Read JDK version from .sdkmanrc"
        id: sdkmanrc
        run: echo "java=$(grep -E '^java=' .sdkmanrc | cut -d= -f2 | sed 's/-librca$//')" >> "$GITHUB_OUTPUT"
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: liberica # .sdkmanrc pins librca = Liberica
          java-version: ${{ steps.sdkmanrc.outputs.java }}
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic # see note above
      - name: "🔎 IntelliJ Plugin Verifier"
        run: ./gradlew verifyPlugin
      - name: "📋 Upload verifier report"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-verifier-report
          path: plugin/build/reports/pluginVerifier
  test-ce:
    name: 'Community Edition Tests'
    # Every pull request and push, and nightly: needs the IdeaIC 2026.2 distribution (~1GB).
    # -PplatformEdition=IC runs the Community-safe test set on that sandbox and points Plugin
    # Verifier at IC, which is what proves the ZIP loads there and that the main jar reaches for
    # no Ultimate class - neither the Ultimate test suite nor the Ultimate verifier catches that.
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "📝 Read JDK version from .sdkmanrc"
        id: sdkmanrc
        run: echo "java=$(grep -E '^java=' .sdkmanrc | cut -d= -f2 | sed 's/-librca$//')" >> "$GITHUB_OUTPUT"
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: liberica # .sdkmanrc pins librca = Liberica
          java-version: ${{ steps.sdkmanrc.outputs.java }}
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic # see note above
      - name: "🏗️ Community Edition build, tests & verifier"
        run: ./gradlew :plugin:testIdeCe verifyPlugin buildPlugin -PplatformEdition=IC
      - name: "📋 Upload Community test report"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-test-ce-report
          path: plugin/build/reports/tests/testIdeCe
      - name: "📋 Upload Community verifier report"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-verifier-ce-report
          path: plugin/build/reports/pluginVerifier
