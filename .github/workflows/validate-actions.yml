name: "Validate GitHub Actions"
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'build-logic/src/main/groovy/org/apache/grails/intellij/build/ValidateActionsTask.groovy'
      - 'build-logic/src/main/groovy/org.apache.grails.intellij.build.validate-actions.gradle'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'build-logic/src/main/groovy/org/apache/grails/intellij/build/ValidateActionsTask.groovy'
      - 'build-logic/src/main/groovy/org.apache.grails.intellij.build.validate-actions.gradle'
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC — catches ASF delisting a pinned SHA
  workflow_dispatch:
permissions:
  contents: read
# queue jobs - cancel in-progress PR runs when new commits are pushed, but allow branch builds to complete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    name: "Validate Actions"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "📝 Read JDK version from .sdkmanrc"
        id: sdkmanrc
        run: echo "java=$(grep -E '^java=' .sdkmanrc | cut -d= -f2 | sed 's/-librca$//')" >> "$GITHUB_OUTPUT"
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: liberica # .sdkmanrc pins librca = Liberica
          java-version: ${{ steps.sdkmanrc.outputs.java }}
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic # 'basic' uses the MIT-licensed, open-source cache provider; the default 'enhanced' provider (v6+) is proprietary (Gradle commercial Terms of Use)
      - name: "🔎 Validate Actions against the ASF approved list"
        run: ./gradlew validateActions
        timeout-minutes: 10
