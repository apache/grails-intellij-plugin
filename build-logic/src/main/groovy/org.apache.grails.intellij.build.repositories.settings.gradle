import org.gradle.api.initialization.resolve.RepositoriesMode

// The single source of truth for where dependencies come from.
//
// This is a precompiled *settings* script plugin (the .settings.gradle suffix), applied from
// settings.gradle rather than by a project. It replaces per-project `repositories { }` blocks,
// which previously appeared in two convention plugins and had to be kept in sync -- and whose
// absence on the root project broke the licence audit the moment the root stopped applying the
// java conventions.
//
// FAIL_ON_PROJECT_REPOS makes the centralisation real: a project that declares its own
// repositories now fails the build instead of quietly diverging.

plugins {
    // Registers the intellijPlatform repositories extension onto dependencyResolutionManagement,
    // so the IntelliJ Platform artifact repositories can be declared here rather than per project.
    id 'org.jetbrains.intellij.platform.settings'
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS

    repositories {
        mavenCentral()
        intellijPlatform {
            defaultRepositories()
        }
    }
}
