// Shared IntelliJ Platform wiring: the artifact repositories and the platform dependency.
// The IPGP version comes from build-logic's classpath, so this is applied without a version.

plugins {
    id 'org.apache.grails.intellij.build.java'
    // Registers the intellijPlatform extensions used below, and it must be applied HERE rather
    // than left to the consuming tier plugin. IPGP registers three separate extensions all named
    // `intellijPlatform` (Project, RepositoryHandler, DependencyHandler); if none of them exists
    // yet when this body runs, Groovy's owner fallback resolves the nested blocks against the
    // Project and reports a misleading "Could not find method defaultRepositories() on extension
    // 'intellijPlatform'". The tier plugins add the .platform or .module variant on top of this.
    id 'org.jetbrains.intellij.platform.base'
}

repositories {
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdea providers.gradleProperty('platformVersion')
    }
}
