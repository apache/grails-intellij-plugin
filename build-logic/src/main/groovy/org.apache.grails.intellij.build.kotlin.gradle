import org.jetbrains.kotlin.gradle.dsl.JvmTarget

// Kotlin conventions. The version comes from build-logic's plugin classpath, so consuming
// build files apply this without a version -- previously 'org.jetbrains.kotlin.jvm' was
// declared with an explicit version in five separate places.

plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.apache.grails.intellij.build.java'
}

def platformJavaVersion = providers.gradleProperty('platformJavaVersion')

// No toolchain on purpose: the JDK is pinned via .sdkmanrc for reproducible builds.
kotlin.compilerOptions.jvmTarget.set(JvmTarget.fromTarget(platformJavaVersion.get()))
