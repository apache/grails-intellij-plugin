import org.gradle.testing.jacoco.plugins.JacocoCoverageReport

// Cross-project JaCoCo aggregation, applied to the root project so the report path that CI
// uploads (build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml) is unchanged
// by the restructure.
//
// jacoco-report-aggregation only auto-registers <suite>CodeCoverageReport for projects that
// apply jvm-test-suite, and the root project compiles nothing. The report is therefore
// registered explicitly here; without this the task simply would not exist and the coverage
// workflow would fail with "task not found".
//
// Report formats are configured by org.apache.grails.intellij.build.jacoco where it is applied;
// this project has no test suite of its own, so the formats are set on the aggregate directly.

plugins {
    id 'jacoco-report-aggregation'
}

reporting.reports.register('testCodeCoverageReport', JacocoCoverageReport) { report ->
    report.testSuiteName = 'test'
}

tasks.named('testCodeCoverageReport') { task ->
    task.reports.xml.required = true
    task.reports.html.required = true
    task.reports.csv.required = false
}
