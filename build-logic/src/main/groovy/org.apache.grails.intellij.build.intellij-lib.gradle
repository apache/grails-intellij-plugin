// A support library that compiles against the IntelliJ Platform. Same tier as
// org.apache.grails.intellij.build.lib, but it applies the platform module plugin.
//
// The composed jar name is pinned rather than derived by IPGP, whose default is
// "${rootProject.name}.${project.path with ':' replaced by '.'}". That default is why these
// jars are currently called "Grails IntelliJ Plugin.jps-plugin.jar" -- it tracks both
// rootProject.name and the project's depth in the tree, so nesting these projects or renaming
// the root would silently rename them. plugin.xml's compileServer.plugin classpath names two
// of these jars literally, so the name has to be stable and space-free.

// It deliberately does NOT apply org.jetbrains.intellij.platform.module. IPGP treats any project
// that applies .module and is reachable from the plugin via api/implementation/runtimeOnly as an
// inferred *content module*, and packages it into lib/modules/. These projects are plain jars that
// must sit in lib/: the compileServer.plugin classpath resolves them there by file name, and a jar
// in lib/modules/ with no <content><module> entry is never loaded at all.
//
// That inference is also configuration-order dependent -- it only bites once the plugin project is
// configured after these -- so it stayed invisible while the plugin lived at the root. Applying only
// .base (via intellij-platform) gives the platform compile classpath without claiming to be a module.

plugins {
    id 'org.apache.grails.intellij.build.intellij-platform'
}

def shortName = projectDir.name

group = 'org.apache.grails.intellij.lib'
// The jar task output is what ships; version dropped so the name is stable across releases.
base.archivesName = "org.apache.grails.intellij.lib.$shortName"

tasks.named('jar') { task ->
    task.archiveVersion = ''
}
