// A compiler plugin: code that runs inside the end user's JPS build process rather than in the
// IDE. These are the jars named by <compileServer.plugin classpath="..."/> in plugin.xml.
//
// Its own top-level tier, compilers/*, a sibling of libs/ rather than nested inside it, so no
// project's coordinates are a prefix of another's and the directory layout says the same thing the
// coordinates do. The directory is plural and the namespace singular, matching libs/ ->
// org.apache.grails.intellij.lib: the directory holds several projects, the namespace names one tier.
//
// These jars still ship to lib/ in the distribution alongside the libraries -- only content
// modules go to lib/modules/ -- but where a jar lands is a packaging detail, whereas the tier
// records what the project IS.
//
// It is still called out separately because JPS resolves the classpath attribute by file name and
// silently skips entries it cannot find, so these jar names are part of the plugin's contract and
// must stay pinned and in sync with the descriptor. Nothing depends on a plain library's name.

// It deliberately does NOT apply org.jetbrains.intellij.platform.module. IPGP treats any project
// that applies .module and is reachable from the plugin via api/implementation/runtimeOnly as an
// inferred *content module*, and packages it into lib/modules/. These projects are plain jars that
// must sit in lib/: the compileServer.plugin classpath resolves them there by file name, and a jar
// in lib/modules/ with no <content><module> entry is never loaded at all.
//
// That inference is also configuration-order dependent -- it only bites once the plugin project is
// configured after these -- so it stayed invisible while the plugin lived at the root. Applying only
// .base (via intellij-platform) gives the platform compile classpath without claiming to be a module.

plugins {
    id 'org.apache.grails.intellij.build.intellij-platform'
}

def shortName = projectDir.name

group = 'org.apache.grails.intellij.compiler'
// Pinned, not derived, and version dropped: this exact file name appears in the descriptor's
// compileServer.plugin classpath, so it must not track rootProject.name or the project's depth.
base.archivesName = "org.apache.grails.intellij.compiler.$shortName"

tasks.named('jar') { task ->
    task.archiveVersion = ''
}
