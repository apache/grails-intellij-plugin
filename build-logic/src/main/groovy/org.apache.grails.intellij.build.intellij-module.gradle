// An IntelliJ *content module* (plugin.xml <content><module name="..."/></content>).
//
// NAMING IS A RUNTIME CONTRACT. The platform resolves a content module from
// lib/modules/<module-name>.jar and reads its descriptor from <module-name>.xml at that jar's
// root, so three things must agree exactly: the <module name> in plugin.xml, the descriptor
// file name, and the composed jar's base name. Getting it wrong builds a valid ZIP that fails
// to load the module at IDE runtime -- invisible to compilation, tests and verifyPlugin.
//
// The name is derived from the project DIRECTORY, not project.name: projects are named with
// their subpath built in (pluginModules-hibernate), so project.name carries a prefix that must
// not leak into the module name.
//
// archivesName only renames the throwaway -base/-instrumented intermediates; IPGP's
// ComposedJarTask applies its own archiveBaseName convention afterwards, so the pin below is
// what actually determines the shipped file name.

plugins {
    id 'org.apache.grails.intellij.build.intellij-platform'
    id 'org.jetbrains.intellij.platform.module'
}

def shortName = projectDir.name

group = 'org.apache.grails.intellij.module'
base.archivesName = shortName

// Deriving the name here is what keeps the three coupled strings from drifting apart: this must
// equal the <module name> in plugin.xml and the descriptor file name in this project's resources.
tasks.named('composedJar') { task ->
    task.archiveBaseName = "org.apache.grails.intellij.module.$shortName"
}
