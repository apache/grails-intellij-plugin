import org.jetbrains.intellij.platform.gradle.tasks.PrepareSandboxTask
import org.jetbrains.intellij.platform.gradle.tasks.VerifyPluginTask

// The IntelliJ plugin project itself. Everything here is plugin-wide configuration that has no
// second consumer; it lives in a convention plugin so plugin/build.gradle carries only content
// (the bundled-plugin list and project dependencies).

plugins {
    id 'org.apache.grails.intellij.build.intellij-platform'
    id 'org.apache.grails.intellij.build.kotlin'
    id 'org.jetbrains.intellij.platform'
}

group = 'org.apache.grails.intellij.plugin'

intellijPlatform {
    // Pinned explicitly. This drives the distribution ZIP name, the plugin directory inside it,
    // and the sandbox directory; its convention is project.name, which would make all three
    // 'plugin'. It is NOT the Marketplace display name -- that comes from <name> in plugin.xml.
    projectName = 'apache-grails-intellij-plugin'

    pluginConfiguration {
        ideaVersion {
            sinceBuild = providers.gradleProperty('pluginSinceBuild')
        }
        changeNotes = ''
    }

    pluginVerification {
        // the legacy plugin id org.intellij.grails is grandfathered on Marketplace and
        // permanent (see MIGRATION-PLAN.md decision 2); mute the new-plugin naming check
        freeArgs = ['-mute', 'TemplateWordInPluginId']
        // gate on real incompatibilities only; the inherited internal/deprecated API
        // usages are a tracked cleanup item, not a release blocker
        failureLevel = [
                VerifyPluginTask.FailureLevel.COMPATIBILITY_PROBLEMS,
                VerifyPluginTask.FailureLevel.MISSING_DEPENDENCIES,
                VerifyPluginTask.FailureLevel.INVALID_PLUGIN,
        ]
        ides {
            recommended()
        }
    }

    // JetBrains Marketplace code signing / publishing; secrets provided by the release workflow.
    // Providers are assigned rather than read, so absent secrets neither fail configuration nor
    // land in the configuration cache.
    signing {
        certificateChain = providers.environmentVariable('CERTIFICATE_CHAIN')
        privateKey = providers.environmentVariable('PRIVATE_KEY')
        password = providers.environmentVariable('PRIVATE_KEY_PASSWORD')
    }

    publishing {
        token = providers.environmentVariable('PUBLISH_TOKEN')
    }
}

// publishPlugin conventions archiveFile from signPlugin's output, i.e. a fresh local build.
// The release pipeline instead uploads the promoted artifact from dist.apache.org, so that what
// lands on the Marketplace is byte-for-byte what the PMC voted on. -PpublishArchive=<path> points
// the task at that ZIP; note publishPlugin also hard-wires dependsOn(buildPlugin, signPlugin) at
// registration, so the release workflow has to pass -x for both as well. Absent the property the
// provider is empty and the signPlugin convention still applies, so a manual publish is unchanged.
tasks.named('publishPlugin') { task ->
    task.archiveFile = layout.file(providers.gradleProperty('publishArchive').map { new File(it) })
}

// The composed jar is what ships in lib/; its base name is conventioned from project.name and
// ignores archivesName, so it is pinned for the same reason projectName is.
tasks.named('composedJar') { task ->
    task.archiveBaseName = 'apache-grails-intellij-plugin'
}

// ASF policy: ship LICENSE and NOTICE inside the plugin jar. They live at the repository root,
// which is the settings directory rather than this project's directory.
tasks.named('processResources') { task ->
    task.from(layout.settingsDirectory.file('LICENSE')) { into 'META-INF' }
    task.from(layout.settingsDirectory.file('NOTICE')) { into 'META-INF' }
}

// standardDsls/ is packaged as loose files under <plugin>/lib/standardDsls/ rather than as jar
// resources, so it is excluded from the resource set and copied into the sandbox instead.
// pluginName is a Property mapped lazily so it tracks projectName above.
tasks.withType(PrepareSandboxTask).configureEach { task ->
    task.from(layout.projectDirectory.dir('standardDsls')) {
        into task.pluginName.map { "$it/lib/standardDsls/" }
    }
}
