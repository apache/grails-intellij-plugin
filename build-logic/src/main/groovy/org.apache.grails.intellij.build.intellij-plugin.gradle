import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType
import org.jetbrains.intellij.platform.gradle.tasks.PrepareSandboxTask
import org.jetbrains.intellij.platform.gradle.tasks.VerifyPluginTask

// The IntelliJ plugin project itself. Everything here is plugin-wide configuration that has no
// second consumer; it lives in a convention plugin so plugin/build.gradle carries only content
// (the bundled-plugin list and project dependencies).

plugins {
    id 'org.apache.grails.intellij.build.intellij-platform'
    id 'org.apache.grails.intellij.build.kotlin'
    id 'org.apache.grails.intellij.build.sbom'
    id 'org.jetbrains.intellij.platform'
}

group = 'org.apache.grails.intellij.plugin'

// The SBOM describes the ZIP, the one unit of distribution, so it is named after it and lists
// everything in it: the runtime classpath (the libraries and compiler jars in lib/) and the content
// modules (lib/modules/), which IPGP carries in a configuration of its own. The platform itself is on
// no runtime configuration, so the host IDE is not listed as a dependency.
sbom {
    componentName = 'apache-grails-intellij-plugin'
    configurations = ['runtimeClasspath', 'intellijPlatformPluginModule']
}

intellijPlatform {
    // Pinned explicitly. This drives the distribution ZIP name, the plugin directory inside it,
    // and the sandbox directory; its convention is project.name, which would make all three
    // 'plugin'. It is NOT the Marketplace display name -- that comes from <name> in plugin.xml.
    projectName = 'apache-grails-intellij-plugin'

    pluginConfiguration {
        ideaVersion {
            sinceBuild = providers.gradleProperty('pluginSinceBuild')
        }
        changeNotes = ''
    }

    pluginVerification {
        // the legacy plugin id org.intellij.grails is grandfathered on Marketplace and
        // permanent for the existing listing; mute the new-plugin naming check
        freeArgs = ['-mute', 'TemplateWordInPluginId']
        // gate on real incompatibilities only; the inherited internal/deprecated API
        // usages are a tracked cleanup item, not a release blocker
        failureLevel = [
                VerifyPluginTask.FailureLevel.COMPATIBILITY_PROBLEMS,
                VerifyPluginTask.FailureLevel.MISSING_DEPENDENCIES,
                VerifyPluginTask.FailureLevel.INVALID_PLUGIN,
        ]
        // -PplatformEdition=IC verifies the Community distribution INSTEAD of the Ultimate set, with
        // the same failure levels. That run is what proves the single ZIP loads on Community
        // Edition (no unresolved required dependency) and that the main jar reaches for no
        // Ultimate class: every Ultimate integration is a content module that is skipped there.
        // The only references allowed to stay unresolved on IC are the class-presence-guarded
        // JavaScript / CSS / graph usages listed in plugin/verifier/community-ignored-problems.txt.
        def communityEdition = providers.gradleProperty('platformEdition').getOrElse('IU') == 'IC'
        ides {
            def requestedIdes = providers.gradleProperty('pluginVerifierIdes')
            if (communityEdition) {
                // useInstaller=false: the standalone IC distribution is no longer published for
                // 2025.3+ (no IC channel in JetBrains' updates.xml), so the installer-URL resolver
                // throws "Couldn't resolve IntellijIdeaCommunity download URL for version: '2026.2'".
                // The `com.jetbrains.intellij.idea:ideaIC` Maven artifact still exists on the
                // cache-redirector intellij-repository, which is what this flag resolves instead.
                create(IntelliJPlatformType.IntellijIdeaCommunity, providers.gradleProperty('platformVersion')) { icConfig ->
                    icConfig.useInstaller.set(false)
                }
            } else if (requestedIdes.isPresent()) {
                // -PpluginVerifierIdes=IU-263.3889.65[,IU-...] verifies against exactly those builds
                // instead of the Marketplace-recommended set, which is how a verdict against an EAP
                // is reproduced (and fixed) before that EAP becomes the recommended release. CI
                // passes nothing and stays on the recommended set.
                requestedIdes.get().split(',')*.trim().findAll().each { String notation ->
                    def (String type, String version) = notation.split('-', 2)
                    create(type, version)
                }
            } else {
                recommended()
            }
        }
        if (communityEdition) {
            ignoredProblemsFile = layout.buildDirectory.file('verifier/community-ignored-problems.txt')
            // IPGP's MISSING_DEPENDENCIES also fires for missing *optional* dependencies, and on IC
            // every Ultimate plugin behind <depends optional="true"> or a content module is
            // expected to be missing. Unresolved *required* dependencies are checked separately
            // below (verifyPlugin doLast) from the verifier's dependency tree.
            failureLevel = [
                    VerifyPluginTask.FailureLevel.COMPATIBILITY_PROBLEMS,
                    VerifyPluginTask.FailureLevel.INVALID_PLUGIN,
            ]
        }
    }
}

// Plugin Verifier's ignore list is versioned: one `<plugin id>:<plugin version>:<regex>` line per
// pattern. The committed pattern file (plugin/verifier/community-ignored-problems.txt) is expanded
// with the current version here so it never has to be edited for a release.
def communityIgnoredProblems = tasks.register('generateCommunityVerifierIgnoreList') { task ->
    def patterns = layout.projectDirectory.file('verifier/community-ignored-problems.txt')
    def output = layout.buildDirectory.file('verifier/community-ignored-problems.txt')
    def pluginVersion = project.version.toString()
    task.description = 'Expands the Community Edition verifier ignore patterns with the plugin version'
    task.inputs.file(patterns)
    task.inputs.property('pluginVersion', pluginVersion)
    task.outputs.file(output)
    task.doLast {
        def lines = patterns.asFile.readLines()*.trim().findAll { it && !it.startsWith('#') }
        // the legacy id org.intellij.grails is permanent for the Marketplace listing (see plugin.xml)
        output.get().asFile.text = lines.collect { "org.intellij.grails:${pluginVersion}:${it}" }.join('\n') + '\n'
    }
}
if (providers.gradleProperty('platformEdition').getOrElse('IU') == 'IC') {
    tasks.named('verifyPlugin') { task ->
        task.dependsOn(communityIgnoredProblems)
        // A required dependency the Community distribution cannot satisfy means the ZIP would not
        // load there at all. The verifier lists it as "(failed)" without "(optional)" among the
        // plugin's direct dependencies in dependencies.txt; optional ones are expected on IC.
        def reportsDir = layout.buildDirectory.dir('reports/pluginVerifier')
        task.doLast {
            def unresolvedRequired = []
            def dir = reportsDir.get().asFile
            if (dir.isDirectory()) {
                dir.eachFileRecurse { file ->
                    if (file.name == 'dependencies.txt') {
                        file.eachLine { line ->
                            if ((line.startsWith('+--- ') || line.startsWith('\\--- '))
                                && line.contains('(failed)') && !line.contains('(optional)')) {
                                unresolvedRequired << line.trim()
                            }
                        }
                    }
                }
            }
            if (!unresolvedRequired.isEmpty()) {
                throw new GradleException('Required dependencies unresolved on IntelliJ IDEA Community Edition, so the plugin would not load there:\n  '
                                          + unresolvedRequired.join('\n  '))
            }
        }
    }
}

intellijPlatform {
    // JetBrains Marketplace code signing / publishing; secrets provided by the release workflow.
    // Providers are assigned rather than read, so absent secrets neither fail configuration nor
    // land in the configuration cache.
    signing {
        certificateChain = providers.environmentVariable('CERTIFICATE_CHAIN')
        privateKey = providers.environmentVariable('PRIVATE_KEY')
        password = providers.environmentVariable('PRIVATE_KEY_PASSWORD')
    }

    publishing {
        token = providers.environmentVariable('PUBLISH_TOKEN')
    }
}

// publishPlugin conventions archiveFiles from signPlugin's output, i.e. a fresh local build.
// The release pipeline instead uploads the promoted artifact from dist.apache.org, so that what
// lands on the Marketplace is byte-for-byte what the PMC voted on. -PpublishArchive=<path> points
// the task at that ZIP; note publishPlugin also hard-wires dependsOn(buildPlugin, signPlugin) at
// registration, so the release workflow has to pass -x for both as well.
//
// archiveFiles is a ConfigurableFileCollection (IPGP 2.19 replaced the RegularFileProperty
// archiveFile when it added native plugin variants), and IPGP adds the signPlugin/buildPlugin
// output with from(), not as a convention. The override therefore has to replace the contents with
// setFrom(), and only when the property is present -- an absent property leaves the collection
// untouched, so a manual publish is unchanged.
tasks.named('publishPlugin') { task ->
    def publishArchive = providers.gradleProperty('publishArchive').map { new File(it) }
    if (publishArchive.isPresent()) {
        task.archiveFiles.setFrom(publishArchive)
    }
}

// The composed jar is what ships in lib/; its base name is conventioned from project.name and
// ignores archivesName, so it is pinned for the same reason projectName is.
tasks.named('composedJar') { task ->
    task.archiveBaseName = 'apache-grails-intellij-plugin'
    // The composed jar carries the jar's META-INF/sbom.json, but its manifest is IPGP's generated
    // one rather than the jar task's, so the attributes the sbom convention sets on `jar` are
    // repeated here for the jar that actually ships.
    task.manifest.attributes('Sbom-Location': 'META-INF/sbom.json', 'Sbom-Format': 'CycloneDX')
}

// ASF policy: ship LICENSE and NOTICE inside the plugin jar. They live at the repository root,
// which is the settings directory rather than this project's directory.
tasks.named('processResources') { task ->
    task.from(layout.settingsDirectory.file('LICENSE')) { into 'META-INF' }
    task.from(layout.settingsDirectory.file('NOTICE')) { into 'META-INF' }
}

// standardDsls/ is packaged as loose files under <plugin>/lib/standardDsls/ rather than as jar
// resources, so it is excluded from the resource set and copied into the sandbox instead.
// pluginName is a Property mapped lazily so it tracks projectName above.
//
// LICENSE and NOTICE go in alongside it, at the root of the plugin directory. The ZIP built from
// this sandbox is the unit that gets staged, voted on and distributed, and policy requires both
// files in every unit of distribution "whether the unit of distribution is a .jar, .msi, .tar.gz,
// .zip, .exe installer, or any other file format" -- having them only in the composed jar's
// META-INF, as processResources does above, does not satisfy that for the ZIP itself.
//
// The SBOM goes in next to them as sbom.json, so a tool fed the ZIP finds it without opening the
// composed jar, which carries the same file at META-INF/sbom.json.
tasks.withType(PrepareSandboxTask).configureEach { task ->
    task.from(layout.projectDirectory.dir('standardDsls')) {
        into task.pluginName.map { "$it/lib/standardDsls/" }
    }
    task.from(layout.settingsDirectory.file('LICENSE')) { into task.pluginName }
    task.from(layout.settingsDirectory.file('NOTICE')) { into task.pluginName }
    task.from(tasks.named('sbom').flatMap { it.sbom }) {
        into task.pluginName
        rename { 'sbom.json' }
    }
}
