// Java compilation conventions for every project that compiles code, plus the per-project
// hygiene plugins so subproject build files do not have to list them.

plugins {
    id 'java'
    id 'org.apache.grails.intellij.build.base'
    id 'org.apache.grails.intellij.build.jacoco'
    id 'org.apache.grails.intellij.build.vulnerability-scan'
    id 'org.apache.grails.intellij.build.test'
}

def platformJavaVersion = providers.gradleProperty('platformJavaVersion')

java.sourceCompatibility = platformJavaVersion.get()
java.targetCompatibility = platformJavaVersion.get()

// Checked-in generated sources (JFlex lexers) live in their own root so regenerating them
// cannot clobber hand-written code. This is the only source-layout override that survives
// the restructure.
sourceSets.named('main') { main ->
    main.java.srcDir 'src/main/gen'
}

tasks.withType(JavaCompile).configureEach { task ->
    task.options.encoding = 'UTF-8'
}
