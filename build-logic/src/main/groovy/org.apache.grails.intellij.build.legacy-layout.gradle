// TRANSITIONAL. Declares the pre-restructure source layout inherited from the JetBrains JPS
// monorepo (src/, gen/, resources/, test/) so that the convention
// plugins can be introduced before any files move.
//
// Every project applies this while the restructure is in flight; it is deleted once all three
// tiers have been normalized to src/main/java, src/main/resources and src/test/java. Declaring
// a srcDir that does not exist is harmless, so one shared block covers all projects even
// though only the plugin project has gen/ and test/.
//
// Do NOT add anything here that is not purely about the old layout.

sourceSets.named('main') { main ->
    main.java.srcDir 'src'
    main.java.srcDir 'gen'
    main.resources.srcDir 'resources'
}

sourceSets.named('test') { test ->
    test.java.srcDir 'test'
}
