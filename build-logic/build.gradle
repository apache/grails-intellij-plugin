plugins {
    id 'groovy-gradle-plugin'
}

// The Gradle DSL build code tier.
group = 'org.apache.grails.intellij.build'

// Gradle plugins that the convention plugins apply. Declaring them here is what lets the
// convention plugins apply them WITHOUT a version, and it removes the previous fragility
// where 'org.jetbrains.intellij.platform.module' was applied version-free in every module
// and resolved only by inheriting the root build script's plugin classpath.
//
// Versions live here rather than in the root gradle.properties because build-logic is a
// separate build and cannot read the root build's properties.
dependencies {
    // Dependabot (gradle ecosystem, /build-logic) keeps these versions current.
    implementation 'org.jetbrains.intellij.platform:intellij-platform-gradle-plugin:2.18.1'
    implementation 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0'
    implementation 'org.nosphere.apache.rat:org.nosphere.apache.rat.gradle.plugin:0.8.1'
    implementation 'org.sonatype.gradle.plugins:scan-gradle-plugin:3.1.6'
}
