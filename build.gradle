// The root project is a pure aggregator: it compiles nothing and produces no artifact. It owns
// only the two things that must run from the repository root -- the licence audit, whose exclude
// patterns are anchored at the audited directory, and the cross-project coverage aggregation,
// which keeps its report at the path CI uploads.
//
// Deliberately no allprojects/subprojects block: every project applies its own convention plugins.
plugins {
    id 'org.apache.grails.intellij.build.rat'
    id 'org.apache.grails.intellij.build.coverage-aggregation'
}

dependencies {
    // Every project that compiles code contributes to the aggregate coverage report.
    jacocoAggregation project(':plugin')
    jacocoAggregation project(':pluginModules-copyright')
    jacocoAggregation project(':pluginModules-coverage')
    jacocoAggregation project(':pluginModules-hibernate')
    jacocoAggregation project(':pluginModules-i18n')
    jacocoAggregation project(':pluginModules-langInjection')
    jacocoAggregation project(':pluginModules-maven')
    jacocoAggregation project(':libs-gradle-tooling')
    jacocoAggregation project(':libs-grails-rt')
    jacocoAggregation project(':libs-testFramework')
    jacocoAggregation project(':compilers-jps-plugin')
    jacocoAggregation project(':compilers-grails-compiler-patch')
}
