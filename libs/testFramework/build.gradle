import org.jetbrains.intellij.platform.gradle.Constants
import org.jetbrains.intellij.platform.gradle.TestFrameworkType

plugins {
    id 'org.apache.grails.intellij.build.intellij-lib'
    id 'org.apache.grails.intellij.build.kotlin'
}

dependencies {
    intellijPlatform {
        bundledPlugin 'org.intellij.groovy'
        bundledPlugin 'com.intellij.gradle' // split out of org.jetbrains.plugins.gradle in 2026.2
        bundledPlugin 'org.jetbrains.plugins.gradle'

        // The test frameworks are added to _production_ deps here, because this project *is* the
        // test framework for the others.
        //
        // Three arguments are passed explicitly. The Kotlin original used named arguments to skip
        // the middle `version` parameter, which Groovy cannot do, so the default has to be spelled
        // out. The types are Kotlin `object`s with private constructors, so `.INSTANCE` is required
        // -- a bare `TestFrameworkType.Platform` is a Class reference in Groovy, not a value.
        // 'compileOnly' replaces JvmConstants.COMPILE_ONLY_CONFIGURATION_NAME, which is Gradle
        // internal API.
        testFramework TestFrameworkType.Plugin.Java.INSTANCE, Constants.Constraints.CLOSEST_VERSION, 'compileOnly'
        testFramework TestFrameworkType.Platform.INSTANCE, Constants.Constraints.CLOSEST_VERSION, 'compileOnly'
        testFramework TestFrameworkType.Plugin.Maven.INSTANCE, Constants.Constraints.CLOSEST_VERSION, 'compileOnly'
        testFramework TestFrameworkType.Plugin.ExternalSystem.INSTANCE, Constants.Constraints.CLOSEST_VERSION, 'compileOnly'
    }

    compileOnly 'junit:junit:4.13.2'
    compileOnly 'org.assertj:assertj-core:4.0.0-M1'

    compileOnly project(':')
}
