platformVersion=2026.2.2
platformJavaVersion=25
pluginSinceBuild=262.10315.125
version=262.1.1-SNAPSHOT

# Community Edition support. The plugin ships as a single ZIP whose plugin.xml declares the
# Ultimate integrations as optional <depends config-file> entries, so the same artifact is
# CE-loadable and IU-featured. -PplatformEdition=IC selects the Community Edition sandbox, test
# and verifier targets; compilation always runs against the Ultimate API while
# ultimateApiClasspath=true (the default). Setting it to false is reserved for a future
# two-ZIP / fully-isolated build variant -- with a single ZIP the Ultimate API must stay on the
# compile classpath (see tasks/ULTIMATE_DEPS_MANIFEST.md).
ultimateApiClasspath=true

kotlin.stdlib.default.dependency=false

# Build-hygiene tool versions
jacocoVersion=0.8.15

# Gradle config
org.gradle.configuration-cache=true
org.gradle.caching=true

# Gradle daemon memory (default 512m thrashes on buildPlugin)
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
