pluginManagement {
    includeBuild('build-logic')
}

rootProject.name = 'grails-intellij-plugin'

// Project names carry their subpath so every project path is unique and readable, and so
// IPGP's path-derived defaults never see a nested path. Directories are remapped below.
['copyright', 'coverage', 'hibernate', 'i18n', 'langInjection', 'maven'].each { name ->
    include "pluginModules-$name"
    project(":pluginModules-$name").projectDir = file("pluginModules/$name")
}


['gradle-tooling', 'grails-rt', 'testFramework'].each { name ->
    include "libs-$name"
    project(":libs-$name").projectDir = file("libs/$name")
}

['jps-plugin', 'grails-compiler-patch'].each { name ->
    include "compilers-$name"
    project(":compilers-$name").projectDir = file("compilers/$name")
}
