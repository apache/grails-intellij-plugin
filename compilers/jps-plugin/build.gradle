plugins {
    id 'org.apache.grails.intellij.build.compiler'
    id 'org.apache.grails.intellij.build.java-legacy'
}

// runs inside the end user's JPS build process
legacyBytecode {
    release = 11
}

dependencies {
    intellijPlatform {
        bundledPlugin 'org.intellij.groovy'
    }

    compileOnly project(':compilers-grails-compiler-patch')
}
